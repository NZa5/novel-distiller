name: Optional Python tooling CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix: {python-version: ['3.9', '3.11', '3.13']}
    runs-on: ubuntu-latest
    env: {OPENAI_API_KEY: '', OPENAI_BASE_URL: '', OPENAI_MODEL: ''}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '${{ matrix.python-version }}'}
      - run: pip install -e 'optional-tooling/python[test]'
      - run: pytest -q optional-tooling/python/tests -m "not live_api" --strict-markers --cov=novel_distiller --cov-report=json:.coverage-python-tooling.json --cov-fail-under=35
      - run: python optional-tooling/python/scripts/check_coverage.py .coverage-python-tooling.json
      - run: rm .coverage-python-tooling.json
      - run: python -m compileall -q optional-tooling/python/novel_distiller
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - shell: pwsh
        run: |
          [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('requirements.txt')) | Out-Null
          [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('optional-tooling/python/requirements.txt')) | Out-Null
          python -m pip install --dry-run --no-deps -r requirements.txt
      - run: python -m pip install -e 'optional-tooling/python[test]'
      - run: python -m pytest -q optional-tooling/python/tests -m 'not live_api'
      - run: python -m build optional-tooling/python
      - shell: pwsh
        run: |
          $wheel = Get-ChildItem optional-tooling/python/dist/*.whl
          python -m zipfile -l $wheel.FullName
          if ((python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('optional-tooling/python/dist/*.whl')[0]); print(any('/tests/' in n or n.endswith('.env') for n in z.namelist()))") -eq 'True') { exit 1 }
  live:
    if: github.event_name == 'workflow_dispatch'
    environment: live-provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install -e 'optional-tooling/python[test]'
      - run: pytest -q optional-tooling/python/tests -m live_api

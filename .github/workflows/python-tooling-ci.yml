name: Optional Python tooling CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix: {python-version: ['3.9', '3.11', '3.13']}
    runs-on: ubuntu-latest
    env: {OPENAI_API_KEY: '', OPENAI_BASE_URL: '', OPENAI_MODEL: ''}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '${{ matrix.python-version }}'}
      - run: pip install -e 'optional-tooling/python[test]'
      - run: pytest -q optional-tooling/python/tests -m "not live_api" --strict-markers --cov=novel_distiller --cov-report=json:$RUNNER_TEMP/coverage.json --cov-fail-under=70
      - run: python optional-tooling/python/scripts/check_coverage.py "$RUNNER_TEMP/coverage.json"
      - run: python -m compileall -q optional-tooling/python/novel_distiller
  live:
    if: github.event_name == 'workflow_dispatch'
    environment: live-provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b163d495a4c3e4e4022e16d87065 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install -e 'optional-tooling/python[test]'
      - run: pytest -q optional-tooling/python/tests -m live_api

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify tag and Skill version
        shell: bash
        run: |
          skill_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' SKILL.md)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$skill_version" || "$skill_version" != "$tag_version" ]]; then
            echo "SKILL.md version '$skill_version' does not match tag '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Run tests
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Build portable Skill package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_root="dist/novel-distiller"
          mkdir -p "$package_root"
          cp SKILL.md LICENSE README.md README.zh-CN.md "$package_root/"
          cp -R references scripts "$package_root/"
          find "$package_root" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$package_root" -type f -name '*.pyc' -delete
          (
            cd dist
            python -m zipfile -c "novel-distiller-skill-${version}.zip" novel-distiller
            sha256sum "novel-distiller-skill-${version}.zip" > "novel-distiller-skill-${version}.zip.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/novel-distiller-skill-${version}.zip" \
            "dist/novel-distiller-skill-${version}.zip.sha256" \
            --verify-tag \
            --latest \
            --title "Novel Distiller Skill ${version}" \
            --generate-notes \
            --notes "Portable Agent Skill package. Download the ZIP and matching SHA-256 file below."

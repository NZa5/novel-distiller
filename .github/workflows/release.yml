name: Skill release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: python scripts/build_skill_release.py --output "$RUNNER_TEMP/novel-distiller.zip"
      - run: |
          python - <<'PY'
          import zipfile, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'novel-distiller.zip')
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert all(not n.endswith('.py') and '/tests/' not in n and '.env' not in n for n in names)
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: novel-distiller-skill
          path: ${{ runner.temp }}/novel-distiller.zip
          if-no-files-found: error

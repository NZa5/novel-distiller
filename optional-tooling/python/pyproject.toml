[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "novel-distiller"
version = "0.3.0"
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["langchain>=0.1.0", "langchain-openai>=0.0.5", "openai>=1.0.0", "pydantic>=2.0.0", "python-dotenv>=1.0.0", "tiktoken>=0.5.0", "networkx>=3.0", "matplotlib>=3.5.0", "ebooklib>=0.18", "beautifulsoup4>=4.12.0", "jieba>=0.42.1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<7", "build>=1.2,<2"]
[project.scripts]
novel-distiller = "novel_distiller.__main__:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["novel_distiller", "novel_distiller.*"]
exclude = ["tests", "tests.*"]
